name: Android Offline APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_OFFSET: '100000'
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_B64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              printf '::error::Configure the repository secret %s. See docs/ANDROID.md. No temporary key is generated.\n' "$name"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Use the repository Yarn version
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build the offline archive
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn tsc --noEmit
          yarn build:offline
      - name: Set increasing version
        shell: bash
        run: |
          printf 'VERSION_CODE=%s\n' "$((VERSION_OFFSET + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          printf 'VERSION_NAME=1.0.%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build and verify permanently signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE="$RUNNER_TEMP/viarchive-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE"
          keytool -list -keystore "$ANDROID_KEYSTORE" -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          bash android/gradlew -p android --no-daemon lintRelease assembleRelease
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/vi-archive-${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "artifacts/vi-archive-${VERSION_NAME}.apk" > artifacts/signature.txt
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          printf 'Version: %s\nVersion code: %s\nCommit: %s\n' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" > artifacts/version.txt
      - name: Downloadable APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: vi-archive-offline-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
